<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Kodu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            display: inline-block;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        button {
            background-color: #4caf50;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #signup-form {
            display: none;
        }

        #signup-button {
            background-color: #3498db;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }

        #signup-button:hover {
            background-color: #2980b9;
        }

        #home-button {
            background-color: #3498db;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }

        #home-button:hover {
            background-color: #2980b9;
        }
        #kayitFormu {
            display: none;
            max-width: 300px;
            margin: 0px auto;
        }
        
    </style>
    
    <script>
        function kayitFormunuGoster() {
            var kayitFormu = document.getElementById("kayitFormu");
            var acmaButonu = document.getElementById("acmaButonu");

            kayitFormu.style.display = "block";
            acmaButonu.style.display = "none";
        }
    </script>
</head>
<body>

    <div class="container">
        <form action="#" method="post">
            <h2>Giriş Yap</h2>
            <label for="login-username">Kullanıcı Adı:</label>
            <input type="text" id="login-username" name="login-username" required>

            <label for="login-password">Şifre:</label>
            <input type="password" id="login-password" name="login-password" required>

            <button type="submit">Giriş Yap</button>
        </form>
        

        <button id="acmaButonu" onclick="kayitFormunuGoster()">Kayıt ol</button>

    <div id="kayitFormu">
        
        <form action="#" method="post"><h2>Kayıt Formu</h2>
            <label for="ad">Ad:</label>
            <input type="text" id="ad" name="ad" required>

            <label for="soyad">Soyad:</label>
            <input type="text" id="soyad" name="soyad" required>

            <label for="email">E-posta:</label>
            <input type="email" id="email" name="email" required>

            <label for="sifre">Şifre:</label>
            <input type="password" id="sifre" name="sifre" required>

            <button type="submit">Kayıt Ol</button>
        </form>
    </div>

       
        <button id="home-button" onclick="goToHome()">Anasayfaya Dön</button>
    </div>

    <script>
        function toggleSignupForm() {
            var signupForm = document.getElementById("signup-form");
            var signupButton = document.getElementById("signup-button");

            if (signupForm.style.display === "none") {
                signupForm.style.display = "block";
                signupButton.innerText = "Kayıt Formunu Gizle";
            }
             else {
                signupForm.style.display = "none";
                signupButton.innerText = "Kayıt Ol";
            }
        }

        function goToHome() {
            
            window.location.href = "anasayfa.html";
        }
    </script>

</body>
</html>
